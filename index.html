<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>running-map</title>
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Liste des courses">
        <header class="sidebar-header">
          <h1>running-map</h1>
          <p>Parcours de démonstration</p>
        </header>
        <section class="sidebar-controls" aria-label="Filtres et actions sur les parcours">
          <div class="map-actions">
            <button id="show-all-runs" type="button">Tout afficher sur la carte</button>
            <button id="hide-all-runs" type="button">Tout masquer sur la carte</button>
          </div>

          <label for="run-search">Recherche</label>
          <input id="run-search" type="search" placeholder="Spa, 2026, Aywaille">

          <label for="year-filter">Ann&eacute;e</label>
          <select id="year-filter"></select>

          <p id="runs-count" class="runs-count"></p>
        </section>
        <section id="selected-run-panel" class="selection-panel" aria-live="polite"></section>
        <section id="runs-list" class="runs-list" aria-live="polite"></section>
      </aside>

      <section class="map-panel" aria-label="Carte des parcours">
        <div id="map"></div>
      </section>
    </main>

    <script src="./vendor/leaflet/leaflet.js"></script>
    <script src="./tracks/demo-stavelot.geojson.js"></script>
    <script src="./tracks/demo-liege.geojson.js"></script>
    <script src="./data/runs.js"></script>
    <script src="./tracks/generated-tracks.js"></script>
    <script src="./data/generated-runs.js"></script>
    <script src="./config/site-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
