<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>running-map</title>
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="left-panel" aria-label="Liste des courses">
        <button class="mobile-panel-close" type="button" data-mobile-panel-close aria-label="Fermer le panneau de recherche">&times;</button>
        <header class="sidebar-header">
          <h1>running-map</h1>
          <p>Parcours de démonstration</p>
        </header>
        <section class="sidebar-controls" aria-label="Filtres et actions sur les parcours">
          <div class="map-actions">
            <button id="reset-run-filters" type="button">R&eacute;initialiser les filtres</button>
          </div>

          <label for="run-search">Recherche</label>
          <input id="run-search" type="search" placeholder="Spa, 2026, Aywaille">

          <label for="year-filter">Ann&eacute;e</label>
          <select id="year-filter"></select>

          <p id="runs-count" class="runs-count"></p>
          <p id="runs-total" class="runs-total"></p>
        </section>
        <section id="runs-list" class="runs-list" aria-live="polite"></section>
      </aside>

      <main class="map-panel" aria-label="Carte des parcours">
        <div class="mobile-panel-actions" aria-label="Contr&ocirc;les des panneaux">
          <button id="mobile-left-panel-toggle" class="mobile-panel-toggle" type="button" aria-controls="runs-list" aria-expanded="false">Recherche</button>
          <button id="mobile-right-panel-toggle" class="mobile-panel-toggle" type="button" aria-controls="selected-run-panel" aria-expanded="false">D&eacute;tails</button>
        </div>
        <div id="map"></div>
      </main>

      <aside class="right-panel" aria-label="D&eacute;tails de la course s&eacute;lectionn&eacute;e">
        <button class="mobile-panel-close" type="button" data-mobile-panel-close aria-label="Fermer le panneau des d&eacute;tails">&times;</button>
        <section id="selected-run-panel" class="selection-panel" aria-live="polite"></section>
      </aside>
    </div>
    <div class="mobile-backdrop" data-mobile-panel-close aria-hidden="true"></div>

    <div id="photo-lightbox" class="photo-lightbox" aria-hidden="true">
      <div class="photo-lightbox__backdrop" data-lightbox-close></div>
      <div class="photo-lightbox__content" role="dialog" aria-modal="true" aria-label="Photo agrandie">
        <button class="photo-lightbox__button photo-lightbox__button--close" type="button" aria-label="Fermer la photo">&times;</button>
        <img class="photo-lightbox__image" alt="">
        <div class="photo-lightbox__footer">
          <button class="photo-lightbox__button photo-lightbox__button--prev" type="button" aria-label="Photo pr&eacute;c&eacute;dente">&lsaquo;</button>
          <p class="photo-lightbox__caption"></p>
          <button class="photo-lightbox__button photo-lightbox__button--next" type="button" aria-label="Photo suivante">&rsaquo;</button>
        </div>
      </div>
    </div>

    <script src="./vendor/leaflet/leaflet.js"></script>
<!--     <script src="./tracks/demo-stavelot.geojson.js"></script>
    <script src="./tracks/demo-liege.geojson.js"></script> -->
    <script src="./data/runs.js"></script>
    <script src="./tracks/generated-tracks.js"></script>
    <script src="./data/generated-runs.js"></script>
    <script src="./config/site-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
